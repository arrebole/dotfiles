[main]
namespace=launcher
font=Adwaita Sans:size=13
use-bold=yes
dpi-aware=auto
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,keywords,exec
match-mode=fzf
match-counter=yes
terminal=alacritty -e
anchor=top
y-margin=260
lines=8
width=42
horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=24
letter-spacing=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

[colors]
background=15171a94
text=c9ccd1ff
prompt=8ec8baff
placeholder=747982ff
input=f0f1f2ff
match=8ec8baff
selection=343a40b8
selection-text=ffffffff
selection-match=a9ded2ff
counter=747982ff
border=69707980

[border]
width=1
radius=12
selection-radius=7

[key-bindings]
prev=Up Control+p
next=Down Control+n
execute=Return KP_Enter
cancel=Escape Control+g