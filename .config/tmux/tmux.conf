# ============================================================================
#  极简适合 agent 开发的 tmux 配置
#  tuned for: Claude Code / Codex / pi-agent / OpenCode
# ============================================================================

# ---------------------------------------------------------------------------
# 0. Plugin Manager (TPM) — install once, then prefix+I to load plugins
# ---------------------------------------------------------------------------
#   git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm

# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# ---------------------------------------------------------------------------
# 1. General / Base
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"       # true-colour + 256
set -ga terminal-overrides ",*:Tc"             # force 24-bit colour passthrough
set -g mouse on                                # mouse pane/window selection
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on                         # propagate focus to apps (nvim)
set -g history-limit 50000                     # deep scrollback for agent logs
set -g set-clipboard on                        # pipe to system clipboard
set -g escape-time 10                          # faster key-sequence response
set -g base-index 1                            # windows start at 1
set -g pane-base-index 1                       # panes start at 1
set -g renumber-windows on                     # renumber on close
set -g allow-passthrough on                    # allow e.g. Kitty graphics

# prefix — Ctrl+a is more ergonomic than Ctrl+b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# quick reload
bind r source-file ~/.config/tmux/tmux.conf \; display "✓ tmux.conf reloaded"

# ---------------------------------------------------------------------------
# 2. Visual — Catppuccin Mocha palette
# ---------------------------------------------------------------------------
#  colour reference (mocha)
#  crust  #11111b   mantle #181825   base   #1e1e2e
#  text   #cdd6f4   subtext #bac2de  overlay #6c7086
#  blue   #89b4fa   lavender #b4befe  green  #a6e3a1
#  red    #f38ba8   peach   #fab387  yellow #f9e2af
#  pink   #f5c2e7   mauve   #cba6f7  teal   #94e2d5
# ---------------------------------------------------------------------------

# -- status bar background
set -g status-style "fg=#cdd6f4,bg=#11111b"
set -g status-position bottom

# -- left side: session name ── window list
set -g status-left-length 32
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold]   #S #[fg=#89b4fa,bg=#1e1e2e] "

# -- window list (in the middle)
set -g window-status-format         "#[fg=#6c7086,bg=#1e1e2e] #I #W "
set -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=#11111b]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e,bold"

# -- 右侧留空，不显示默认时间和日期
set -g status-right ""

# -- pane borders
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# -- messages & command bar
set -g message-style "fg=#cdd6f4,bg=#313244,fill=#313244,width=100%,align=left"
set -g message-command-style "fg=#cdd6f4,bg=#313244,fill=#313244,width=100%,align=left"

# -- mode indicator (copy mode etc.)
set -g mode-style "fg=#11111b,bg=#89b4fa,bold"

# -- 浮动窗口：近黑底、冷白字、霓虹绿边框
set -g popup-style "fg=#d6fff3,bg=#05090b"
set -g popup-border-style "fg=#00e5a8,bg=#05090b,bold"

# ---------------------------------------------------------------------------
# 3. Agent monitoring — marmonitor (install: npm i -g marmonitor)
#    Shows agent counts, phase badges, attention pills in the status bar.
#    Option+1..9 jumps directly to the agent pane needing attention.
# ---------------------------------------------------------------------------
# set -g @marmonitor_enable 1
# set -g status-right "#{marmonitor}"

# ---------------------------------------------------------------------------
# 4. Local defaults
# ---------------------------------------------------------------------------
# 保持状态栏按键与复制模式一致，替代 tmux-sensible 的对应默认值。
set -g status-keys vi

# ---------------------------------------------------------------------------
# 5. Keybindings — vim-style
# ---------------------------------------------------------------------------

# -- splitting  ( |  vertical,  -  horizontal)
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind '%'

# -- vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- resize panes with Alt+hjkl (no prefix needed)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# -- window management
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -I '#W' 'rename-window "%%"'
bind x kill-pane
bind X kill-window

# -- 浮动终端（替代默认时钟模式）
bind t display-popup -E -b double -d '#{pane_current_path}' -w 85% -h 85%

# -- swap windows
bind -n C-S-Left  swap-window -t -1
bind -n C-S-Right swap-window -t +1

# -- vi copy mode (vim keys to select & yank)
set -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- 鼠标选中/点击后不跳回末尾
#     取消所有会导致 exit copy mode 的默认鼠标绑定
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDown1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi MouseDown1Pane send -X cursor-position

# -- synchronize panes (broadcast to all panes)
bind S setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

# -- break pane into new window
bind ! break-pane

# -- promote pane to window
bind @ command-prompt -p "(join-pane -s %% -t :)" 'join-pane -s "%%" -t ":"'

# ---------------------------------------------------------------------------
# 6. Smart window naming — auto-rename to current dir or running command
# ---------------------------------------------------------------------------
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# ---------------------------------------------------------------------------
# 7. TPM bootstrap — keep this at the very bottom
# ---------------------------------------------------------------------------
run '~/.local/share/tmux/plugins/tpm/tpm'
